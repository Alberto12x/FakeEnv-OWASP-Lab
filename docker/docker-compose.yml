# FakeEnv blog subsystem — Drupal 7 (legacy / EOL) + MariaDB.
#
# Drupal 7 reached end-of-life in January 2025 and is used here ON PURPOSE as a
# vulnerable legacy component for the OWASP TFM. Do not expose this to the
# public internet.
#
# Usage:
#   cd docker
#   docker compose up -d
#   docker compose exec drupal bash /seed/seed_blog.sh   # one-time content seeding
#   open http://localhost:8080   (admin / admin123)

services:
  drupal_db:
    image: mariadb:10.6
    container_name: fakenv_drupal_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupal
    # Registra TODAS las consultas (general log) y los errores en ficheros que
    # el SIEM ingiere. Requiere: mkdir -p ../logs/drupal/mariadb && chmod 777 ...
    command: >-
      --general-log=1
      --general-log-file=/var/log/mysql/general.log
      --log-error=/var/log/mysql/error.log
    volumes:
      - drupal_db_data:/var/lib/mysql
      - ../logs/drupal/mariadb:/var/log/mysql
    restart: unless-stopped

  drupal:
    build:
      context: .
      dockerfile: Dockerfile.drupal
    image: fakenv/drupal7.30
    container_name: fakenv_drupal
    depends_on:
      - drupal_db
    ports:
      - "8080:80"
    volumes:
      # Persist sites/default (settings.php + uploaded files) so the install
      # survives image rebuilds and container recreation.
      - drupal_data:/var/www/html/sites/default
      # Mount the whole docker/ dir (not a single file) so edits to seed_blog.sh
      # are reflected live inside the container.
      - ./:/seed:ro
      # Logs de Apache (access/error) hacia el SIEM. El fichero de conf añade
      # logging a fichero sin tener que reconstruir la imagen.
      - ../logs/drupal/apache:/var/log/apache2
      - ./apache-logs.conf:/etc/apache2/conf-enabled/zzz-fakenv-logs.conf:ro
    restart: unless-stopped

volumes:
  drupal_db_data:
  drupal_data:
