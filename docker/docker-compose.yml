# FakeEnv blog subsystem — Drupal 7 (legacy / EOL) + MariaDB.
#
# Drupal 7 reached end-of-life in January 2025 and is used here ON PURPOSE as a
# vulnerable legacy component for the OWASP TFM. Do not expose this to the
# public internet.
#
# Usage:
#   cd docker
#   docker compose up -d
#   docker compose exec drupal bash /seed_blog.sh   # one-time content seeding
#   open http://localhost:8080   (admin / admin123)

services:
  drupal_db:
    image: mariadb:10.6
    container_name: fakenv_drupal_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupal
    volumes:
      - drupal_db_data:/var/lib/mysql
    restart: unless-stopped

  drupal:
    image: drupal:7
    container_name: fakenv_drupal
    depends_on:
      - drupal_db
    ports:
      - "8080:80"
    volumes:
      - drupal_files:/var/www/html/sites/default/files
      - ./seed_blog.sh:/seed_blog.sh:ro
    restart: unless-stopped

volumes:
  drupal_db_data:
  drupal_files:
