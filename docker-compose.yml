# Stack ÚNICO de FakeEnv: levanta TODO con un solo comando y en la misma red.
#
#   docker compose up -d --build
#
#   - App:       web (gunicorn) + nginx       -> http://localhost:8000
#   - Blog:      drupal 7.30 + MariaDB        -> http://localhost:8080
#   - SIEM Web:  Wazuh Dashboard (HTTPS)      -> https://localhost (admin / SecretPassword123!)
#   - SIEM Logs: wazuh (manager)              -> alarmas en /var/ossec/logs/alerts/alerts.json

services:
  # ─────────────────────────── App FakeEnv ───────────────────────────
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    image: fakenv/web
    container_name: fakenv_web
    environment:
      FLASK_DEBUG: "0"
      SECRET_KEY: "86f1746da2e93d1a916ba4686a5b79e519baf6c9c628139a2cbe934f488bec1a"
      PASSWORD_SALT: "s4l7_f4k3nv_2026"
    volumes:
      - .:/app
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: fakenv_nginx
    depends_on:
      - web
    ports:
      - "8000:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped

  # ─────────────────────────── Blog Drupal ───────────────────────────
  drupal_db:
    image: mariadb:10.6
    container_name: fakenv_drupal_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupal
    command: >-
      --general-log=1
      --general-log-file=/var/log/mysql/general.log
      --log-error=/var/log/mysql/error.log
    volumes:
      - drupal_db_data:/var/lib/mysql
      - ./logs/drupal/mariadb:/var/log/mysql
    restart: unless-stopped

  drupal:
    build:
      context: ./docker
      dockerfile: Dockerfile.drupal
    image: fakenv/drupal7.30
    container_name: fakenv_drupal
    depends_on:
      - drupal_db
    ports:
      - "8080:80"
    volumes:
      - drupal_data:/var/www/html/sites/default
      - ./docker:/seed:ro
      - ./logs/drupal/apache:/var/log/apache2
      - ./docker/apache-logs.conf:/etc/apache2/conf-enabled/zzz-fakenv-logs.conf:ro
    restart: unless-stopped

  # ─────────────────────────── Generador de Certificados ────────────────────────────
  wazuh_certs:
    image: wazuh/wazuh-certs-generator:0.0.1
    container_name: fakenv_wazuh_certs
    environment:
      - HTTP_PROVIDER=github
    volumes:
      - wazuh_certs:/certs
      - ./siem/certs/config.yml:/config.yml:ro
    command: -c /config.yml

  # ─────────────────────────── SIEM Wazuh ────────────────────────────
  wazuh_indexer:
    image: wazuh/wazuh-indexer:4.9.0
    container_name: fakenv_wazuh_indexer
    hostname: wazuh.indexer
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISCOVERY_TYPE=single-node
      - WAZUH_INDEXER_PASSWORD=SecretPassword123!
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh_indexer_data:/usr/share/wazuh-indexer/data
      - wazuh_certs:/usr/share/wazuh-indexer/config/certs:ro
    ports:
      - "9200:9200"
    depends_on:
      wazuh_certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s -k -u admin:SecretPassword123! https://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  wazuh:
    image: wazuh/wazuh-manager:4.9.0
    container_name: fakenv_wazuh
    hostname: wazuh.manager
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USER=admin
      - INDEXER_PASSWORD=SecretPassword123!
      - FILEBEAT_SSL_VERIFY_MODE=none
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    volumes:
      - ./logs:/var/log/fakenv:ro
      - ./siem/config/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./siem/config/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml:ro
      - wazuh_alerts:/var/ossec/logs/alerts
      - wazuh_certs:/etc/filebeat/certs:ro
    depends_on:
      wazuh_indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 55000"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  wazuh_dashboard:
    image: wazuh/wazuh-dashboard:4.9.0
    container_name: fakenv_wazuh_dashboard
    hostname: wazuh.dashboard
    ports:
      - "443:5601"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USER=admin
      - INDEXER_PASSWORD=SecretPassword123!
      - WAZUH_API_URL=https://wazuh.manager:55000
      - WAZUH_API_USER=wazuh
      - WAZUH_API_PASSWORD=SecretPassword123!
      - DASHBOARD_USERNAME=admin
      - DASHBOARD_PASSWORD=SecretPassword123!
      - API_SSL_VERIFICATION_MODE=none
      - INDEXER_SSL_VERIFICATION_MODE=none
    volumes:
      - wazuh_certs:/usr/share/wazuh-dashboard/config/certs:ro
    depends_on:
      wazuh:
        condition: service_healthy
    restart: unless-stopped

volumes:
  drupal_db_data:
  drupal_data:
  wazuh_alerts:
  wazuh_certs:
  wazuh_indexer_data: