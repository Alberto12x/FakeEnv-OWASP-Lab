# Stack ÚNICO de FakeEnv: levanta TODO con un solo comando y en la misma red.
#
#   docker compose up -d --build
#
#   - App:   web (gunicorn) + nginx       -> http://localhost:8000
#   - Blog:  drupal 7.30 + MariaDB        -> http://localhost:8080
#   - SIEM:  wazuh (manager)              -> alarmas en /var/ossec/logs/alerts/alerts.json
#
# Integración por la carpeta compartida ./logs (que el SIEM ingiere).
# Primer arranque (ver docs/SIEM.md):
#   mkdir -p logs/app logs/nginx logs/drupal/apache logs/drupal/mariadb
#   chmod 777 logs/drupal/mariadb
#   docker compose run --rm web python seed.py        # BD de la app
#   docker compose up -d --build
#   docker compose exec drupal bash /seed/seed_blog.sh   # contenido del blog (1ª vez)

services:
  # ─────────────────────────── App FakeEnv ───────────────────────────
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    image: fakenv/web
    container_name: fakenv_web
    environment:
      FLASK_DEBUG: "0"
      SECRET_KEY: "86f1746da2e93d1a916ba4686a5b79e519baf6c9c628139a2cbe934f488bec1a"
      PASSWORD_SALT: "s4l7_f4k3nv_2026"
    volumes:
      - .:/app                 # código + fakenv.db + ./logs compartidos con el host
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: fakenv_nginx
    depends_on:
      - web
    ports:
      - "8000:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped

  # ─────────────────────────── Blog Drupal ───────────────────────────
  drupal_db:
    image: mariadb:10.6
    container_name: fakenv_drupal_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupal
    command: >-
      --general-log=1
      --general-log-file=/var/log/mysql/general.log
      --log-error=/var/log/mysql/error.log
    volumes:
      - drupal_db_data:/var/lib/mysql
      - ./logs/drupal/mariadb:/var/log/mysql
    restart: unless-stopped

  drupal:
    build:
      context: ./docker
      dockerfile: Dockerfile.drupal
    image: fakenv/drupal7.30
    container_name: fakenv_drupal
    depends_on:
      - drupal_db
    ports:
      - "8080:80"
    volumes:
      - drupal_data:/var/www/html/sites/default
      - ./docker:/seed:ro
      - ./logs/drupal/apache:/var/log/apache2
      - ./docker/apache-logs.conf:/etc/apache2/conf-enabled/zzz-fakenv-logs.conf:ro
    restart: unless-stopped

  # ─────────────────────────── SIEM Wazuh ────────────────────────────
  wazuh:
    image: wazuh/wazuh-manager:4.9.2
    container_name: fakenv_wazuh
    hostname: wazuh.manager
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    volumes:
      - ./logs:/var/log/fakenv:ro
      - ./siem/config/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./siem/config/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml:ro
      - wazuh_alerts:/var/ossec/logs/alerts
    restart: unless-stopped

volumes:
  drupal_db_data:
  drupal_data:
  wazuh_alerts:
