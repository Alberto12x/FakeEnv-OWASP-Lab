{% extends "admin/base_admin.html" %}

{% block title %}Nuevo usuario — FakEnv Admin{% endblock %}
{% block page_title %}<h1>Nuevo usuario</h1>{% endblock %}

{% block content %}
<a href="{{ url_for('admin.users') }}" class="back-link">← Volver a usuarios</a>

<form action="{{ url_for('admin.user_new') }}" method="POST" class="admin-form">
    <label for="username">Usuario *</label>
    <input type="text" id="username" name="username" value="{{ form.get('username', '') }}" required>

    <label for="email">Email *</label>
    <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" required>

    <label for="password">Contraseña *</label>
    <input type="text" id="password" name="password" required>

    <label for="role">Rol</label>
    <select id="role" name="role">
        <option value="user" {% if form.get('role') != 'admin' %}selected{% endif %}>user</option>
        <option value="admin" {% if form.get('role') == 'admin' %}selected{% endif %}>admin</option>
    </select>

    <label for="name">Nombre</label>
    <input type="text" id="name" name="name" value="{{ form.get('name', '') }}">

    <label for="surname">Apellidos</label>
    <input type="text" id="surname" name="surname" value="{{ form.get('surname', '') }}">

    <label for="address">Dirección</label>
    <input type="text" id="address" name="address" value="{{ form.get('address', '') }}">

    <label for="city">Ciudad</label>
    <input type="text" id="city" name="city" value="{{ form.get('city', '') }}">

    <label for="security_question">Pregunta de seguridad</label>
    <select id="security_question" name="security_question">
        {% for question in security_questions %}
        <option value="{{ question }}" {% if form.get('security_question') == question %}selected{% endif %}>
            {{ question }}
        </option>
        {% endfor %}
    </select>

    <label for="security_answer">Respuesta de seguridad</label>
    <input type="text" id="security_answer" name="security_answer" value="{{ form.get('security_answer', '') }}">

    <button type="submit">Crear usuario</button>
</form>
{% endblock %}
