{% extends "base.html" %}

{% block title %}Pregunta de seguridad — FakEnv{% endblock %}

{% block content %}
<section class="auth-card">
    <h1>Pregunta de seguridad</h1>
    <p>Responde a tu pregunta de seguridad para establecer una nueva contraseña.</p>
    <form action="{{ url_for('auth.forgot_reset') }}" method="POST">
        <input type="hidden" name="username" value="{{ user.username }}">

        <label>Pregunta</label>
        <p class="security-question">{{ user.security_question }}</p>

        <label for="answer">Tu respuesta</label>
        <input type="text" id="answer" name="answer" required autofocus>

        <label for="new_password">Nueva contraseña</label>
        <input type="password" id="new_password" name="new_password" required>

        <button type="submit">Cambiar contraseña</button>
    </form>
</section>
{% endblock %}
