<!--
  Configuración del Wazuh Manager para FakeEnv (sustituye a la ossec.conf por
  defecto vía /wazuh-config-mount). Define las fuentes de log a recoger y carga
  los decoders/reglas integrados + los nuestros (etc/rules/local_rules.xml).
-->
<ossec_config>

  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <email_notification>no</email_notification>
    <update_check>no</update_check>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
  </alerts>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <!-- ─── Fuentes de log de FakeEnv (../logs montado en /var/log/fakenv) ─── -->

  <!-- App Flask: eventos de seguridad (JSON) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/fakenv/app/fakenv.log</location>
  </localfile>

  <!-- App Flask: todas las sentencias SQL (JSON) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/fakenv/app/sql.log</location>
  </localfile>

  <!-- nginx (reverse proxy de la app) -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/fakenv/nginx/access.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/fakenv/nginx/error.log</location>
  </localfile>

  <!-- Apache del blog Drupal -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/fakenv/drupal/apache/access.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/fakenv/drupal/apache/error.log</location>
  </localfile>

  <!-- MariaDB del blog Drupal: general query log + error log -->
  <localfile>
    <log_format>mysql_log</log_format>
    <location>/var/log/fakenv/drupal/mariadb/general.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/fakenv/drupal/mariadb/error.log</location>
  </localfile>

</ossec_config>
