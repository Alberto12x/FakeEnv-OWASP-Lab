# SIEM (Wazuh) para FakeEnv.
#
# El Wazuh Manager es el recolector + motor de detección: lee los logs
# centralizados en ../logs (app, nginx, drupal/apache, mariadb), los decodifica,
# aplica decoders/reglas (incluidas las nuestras) y genera ALARMAS en
# /var/ossec/logs/alerts/alerts.json.
#
# Uso:
#   cd siem && docker compose up -d
#   docker compose exec wazuh.manager tail -f /var/ossec/logs/alerts/alerts.json
#
# (El Indexer + Dashboard web son opcionales; ver docs/SIEM.md.)

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.2
    container_name: fakenv_wazuh
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    volumes:
      - ../logs:/var/log/fakenv:ro
      - ./config/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./config/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml:ro
      - wazuh_alerts:/var/ossec/logs/alerts

volumes:
  wazuh_alerts:
